---
include:
  # OLED display (built-in SSD1306 from sofle shield)
  - board: nice_nano//zmk
    shield: sofle_left
    snippet: studio-rpc-usb-uart
  - board: nice_nano//zmk
    shield: sofle_right

  # nice!view display (ZMK built-in nice_view shield)
  # NOTE: nice!view shares pin P0.20 with the rotary encoder on Sofle.
  # The encoder is disabled on these build variants to avoid a pin conflict.
  - board: nice_nano//zmk
    shield: sofle_left nice_view_adapter nice_view
    snippet: studio-rpc-usb-uart
  - board: nice_nano//zmk
    shield: sofle_right nice_view_adapter nice_view

  - board: nice_nano//zmk
    shield: settings_reset
